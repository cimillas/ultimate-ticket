<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultimate Ticket Console - Admin</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Ultimate Ticket Console</h1>
          <p>Admin tools for events and zones.</p>
        </div>
        <div class="header-meta">
          <nav class="nav">
            <a href="/">Console</a>
            <a href="/admin/" id="admin-link" aria-current="page" hidden>Admin</a>
            <a href="/login/" id="login-link">Login</a>
          </nav>
          <div class="auth-status" hidden>
            <span>Signed in:</span>
            <strong id="auth-status"></strong>
            <button class="button-secondary" type="button" id="logout-button">Logout</button>
          </div>
        </div>
      </header>

      <div class="layout">
        <div class="stack">
          <div class="group">
            <div class="group-title">Events</div>
            <section class="input-section">
              <h2>Create event</h2>
              <form id="create-event" autocomplete="off">
                <label>
                  Name
                  <input name="name" required />
                </label>
                <label>
                  Starts at (local time)
                  <input name="starts_at" type="datetime-local" />
                </label>
                <button type="submit">Create event</button>
              </form>
            </section>

            <section class="input-section">
              <h2>List events</h2>
              <div class="form-block">
                <button id="list-events" type="button">List events</button>
              </div>
            </section>

            <section class="input-section">
              <h2>Cancel event</h2>
              <form id="cancel-event" autocomplete="off">
                <label>
                  Event (select or paste ID)
                  <div class="event-picker" data-event-picker>
                    <input name="event_id" required />
                    <div class="event-dropdown" data-event-dropdown hidden></div>
                  </div>
                </label>
                <button type="submit">Cancel event</button>
              </form>
            </section>
          </div>

          <div class="group">
            <div class="group-title">Zones</div>
            <section class="input-section">
              <h2>Create zone</h2>
              <form id="create-zone" autocomplete="off">
                <label>
                  Event (select or paste ID)
                  <div class="event-picker" data-event-picker>
                    <input name="event_id" required />
                    <div class="event-dropdown" data-event-dropdown hidden></div>
                  </div>
                </label>
                <label>
                  Name
                  <input name="name" required />
                </label>
                <label>
                  Capacity
                  <input name="capacity" type="number" min="1" required />
                </label>
                <button type="submit">Create zone</button>
              </form>
            </section>

            <section class="input-section">
              <h2>List zones</h2>
              <form id="list-zones" autocomplete="off">
                <label>
                  Event (select or paste ID)
                  <div class="event-picker" data-event-picker>
                    <input name="event_id" required />
                    <div class="event-dropdown" data-event-dropdown hidden></div>
                  </div>
                </label>
                <button type="submit">List zones</button>
              </form>
            </section>

            <section class="input-section">
              <h2>List active holds</h2>
              <form id="list-active-holds" autocomplete="off">
                <label>
                  Event (select or paste ID)
                  <div class="event-picker" data-event-picker>
                    <input name="event_id" required />
                    <div class="event-dropdown" data-event-dropdown hidden></div>
                  </div>
                </label>
                <label>
                  Zone (select or paste ID)
                  <div class="zone-picker" data-zone-picker>
                    <input name="zone_id" required />
                    <div class="zone-dropdown" data-zone-dropdown hidden></div>
                  </div>
                </label>
                <button type="submit">List active holds</button>
              </form>
            </section>

            <section class="input-section">
              <h2>List confirmed orders</h2>
              <form id="list-confirmed-orders" autocomplete="off">
                <label>
                  Event (select or paste ID)
                  <div class="event-picker" data-event-picker>
                    <input name="event_id" required />
                    <div class="event-dropdown" data-event-dropdown hidden></div>
                  </div>
                </label>
                <label>
                  Zone (select or paste ID)
                  <div class="zone-picker" data-zone-picker>
                    <input name="zone_id" required />
                    <div class="zone-dropdown" data-zone-dropdown hidden></div>
                  </div>
                </label>
                <button type="submit">List confirmed orders</button>
              </form>
            </section>
          </div>
        </div>

        <section class="response-panel">
          <h2>Response</h2>
          <pre id="output"></pre>
        </section>
      </div>

      <script type="module" src="/src/admin.js"></script>
    </main>
  </body>
</html>
