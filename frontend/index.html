<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultimate Ticket Console</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Ultimate Ticket Console</h1>
          <p>Local tools for events, zones, holds, and confirms.</p>
        </div>
        <nav class="nav">
          <a href="/" aria-current="page">Console</a>
          <a href="/admin/">Admin</a>
        </nav>
      </header>

      <div class="layout">
        <div class="stack">
          <section class="input-section">
            <h2>List events</h2>
            <div class="form-block">
              <button id="list-events" type="button">List events</button>
            </div>
          </section>

          <section class="input-section">
            <h2>List zones</h2>
            <form id="list-zones">
              <label>
                Event (select or paste ID)
                <div class="event-picker" data-event-picker>
                  <input name="event_id" required />
                  <div class="event-dropdown" data-event-dropdown hidden></div>
                </div>
              </label>
              <button type="submit">List zones</button>
            </form>
          </section>

          <section class="input-section">
            <h2>Holds</h2>
            <form id="create-hold">
              <label>
                Event (select or paste ID)
                <div class="event-picker" data-event-picker>
                  <input name="event_id" required />
                  <div class="event-dropdown" data-event-dropdown hidden></div>
                </div>
              </label>
              <label>
                Zone (select or paste ID)
                <div class="zone-picker" data-zone-picker>
                  <input name="zone_id" required />
                  <div class="zone-dropdown" data-zone-dropdown hidden></div>
                </div>
              </label>
              <label>
                Quantity
                <input name="quantity" type="number" min="1" required />
              </label>
              <label>
                Idempotency Key
                <div class="inline-field">
                  <input name="idempotency_key" required />
                  <button class="button-secondary" type="button" id="regen-hold-key">
                    Regenerate
                  </button>
                </div>
              </label>
              <button type="submit">Create hold</button>
            </form>
          </section>

          <section class="input-section">
            <h2>Confirm hold</h2>
            <form id="confirm-hold">
              <label>
                Hold ID
                <input name="hold_id" required />
              </label>
              <label>
                Idempotency Key
                <div class="inline-field">
                  <input name="idempotency_key" required />
                  <button class="button-secondary" type="button" id="regen-confirm-key">
                    Regenerate
                  </button>
                </div>
              </label>
              <button type="submit">Confirm hold</button>
            </form>
          </section>
        </div>

        <section class="response-panel">
          <h2>Response</h2>
          <pre id="output"></pre>
        </section>
      </div>

      <script type="module" src="/src/main.js"></script>
    </main>
  </body>
</html>
