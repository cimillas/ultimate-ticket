<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultimate Ticket Dashboard</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Ultimate Ticket Dashboard</h1>
          <p>Local tools for events, zones, holds, and confirms.</p>
        </div>
        <div class="header-meta">
          <nav class="nav">
            <a href="/" aria-current="page">Dashboard</a>
            <a href="/admin/" id="admin-link" hidden>Admin</a>
            <a href="/login/" id="login-link">Login</a>
          </nav>
          <div class="auth-status" hidden>
            <span>Signed in:</span>
            <strong id="auth-status"></strong>
            <button class="button-secondary" type="button" id="logout-button">Logout</button>
          </div>
        </div>
      </header>

      <div class="layout">
        <div class="stack">
          <section class="input-section">
            <h2>Browse events</h2>
            <div class="form-block">
              <button id="list-events" type="button">Show events</button>
            </div>
          </section>

          <section class="input-section">
            <h2>Find zones</h2>
            <form id="list-zones" autocomplete="off">
              <label>
                Event (select or paste ID)
                <div class="event-picker" data-event-picker>
                  <input name="event_id" required />
                  <div class="event-dropdown" data-event-dropdown hidden></div>
                </div>
              </label>
              <button type="submit">Show zones</button>
            </form>
          </section>

          <section class="input-section" data-auth-only hidden>
            <h2>Reserve tickets</h2>
            <form id="create-hold" autocomplete="off">
              <label>
                Event (select or paste ID)
                <div class="event-picker" data-event-picker>
                  <input name="event_id" required />
                  <div class="event-dropdown" data-event-dropdown hidden></div>
                </div>
              </label>
              <label>
                Zone (select or paste ID)
                <div class="zone-picker" data-zone-picker>
                  <input name="zone_id" required />
                  <div class="zone-dropdown" data-zone-dropdown hidden></div>
                </div>
              </label>
              <label>
                Quantity
                <input name="quantity" type="number" min="1" required />
              </label>
              <label>
                Idempotency Key
                <div class="inline-field">
                  <input name="idempotency_key" required />
                  <button class="button-secondary" type="button" id="regen-hold-key">
                    Regenerate
                  </button>
                </div>
              </label>
              <button type="submit">Create hold</button>
            </form>
          </section>

          <section class="input-section" data-auth-only hidden>
            <h2>Confirm reservation</h2>
            <form id="confirm-hold" autocomplete="off">
              <label>
                Hold (select or paste ID)
                <div class="hold-picker" data-hold-picker>
                  <input name="hold_id" required />
                  <div class="hold-dropdown" data-hold-dropdown hidden></div>
                </div>
              </label>
              <label>
                Idempotency Key
                <div class="inline-field">
                  <input name="idempotency_key" required />
                  <button class="button-secondary" type="button" id="regen-confirm-key">
                    Regenerate
                  </button>
                </div>
              </label>
              <button type="submit">Confirm hold</button>
            </form>
          </section>

          <section class="input-section" data-auth-only hidden>
            <h2>My activity</h2>
            <div class="form-block">
              <button id="list-my-holds" type="button">List my active holds</button>
              <button id="list-my-orders" type="button">List my orders</button>
            </div>
          </section>

          <section class="input-section" data-auth-only hidden>
            <h2>Account</h2>
            <form id="change-password" autocomplete="off">
              <label>
                Current password
                <input name="current_password" type="password" required />
              </label>
              <label>
                New password
                <input name="new_password" type="password" required />
              </label>
              <button type="submit">Update password</button>
            </form>
          </section>
        </div>

        <section class="response-panel">
          <h2>API response</h2>
          <pre id="output"></pre>
        </section>
      </div>

      <script type="module" src="/src/main.js"></script>
    </main>
  </body>
</html>
